name: CI

on:
  workflow_dispatch:

  # main only. A merge is a push event and pull_request does not fire for it, so this is the run that
  # verifies main and uploads to Codecov. Listing every branch here instead would double-run each
  # commit pushed to a branch that already has a PR open, since pull_request covers those already.
  #
  # No paths-ignore here, deliberately — see the `changes` job.
  push:
    branches: [ main ]

  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read

# Supersede an in-flight run when new commits land on the same ref. main is exempt: its run is the
# only one that uploads to Codecov, so cancelling it on a quick second merge would leave the branch
# without a coverage report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Does this change contain anything the quality gate would look at? See
  # .github/workflows/detect-changes.yml — the filter lives in a job rather than under `on:`
  # because `quality` is a required status check, and a workflow that never starts leaves its
  # check Pending forever. `build` rather than `code` is the output to read here: it is the wider
  # of the two, and it includes docs/VAPID.md, whose snippet VapidGuideKeyGenerationTest executes.
  changes:
    uses: ./.github/workflows/detect-changes.yml

  quality:
    needs: changes
    # `!= 'false'` and not `== 'true'`, with `!cancelled()` so the job starts although `needs`
    # did not: a `changes` job that dies — a failed checkout, a lost runner, the five-minute
    # timeout — leaves its outputs empty, and an empty output must mean "run the gate". Under
    # `== 'true'` it meant the opposite: the job was skipped, a skipped required check counts as
    # passed, and a pull request could merge without the gate ever running. The filter's own
    # fail-open lives inside the step and cannot cover the step not running at all. A
    # documentation-only change still sets `build=false` explicitly and is still skipped.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Testcontainers' Ryuk container must mount the daemon socket path as seen
      # from inside the runner's Docker VM.
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      # Codecov uploads run for main and for pull requests raised from this repository. Two cases
      # cannot, both because secrets.CODECOV_TOKEN expands to an empty string and the upload then
      # fails on a missing token instead of adding anything:
      #
      #   * a pull request from a fork — secrets are not exposed to it at all;
      #   * anything Dependabot opened. Its runs read from a SEPARATE secret store (Settings →
      #     Secrets → Dependabot), so a repository Actions secret is not visible even though the
      #     branch lives in this repository and is therefore not a fork. Nothing is lost by
      #     skipping: a dependency bump changes no source lines, so Codecov's patch analysis has
      #     nothing to report on it.
      #
      # The alternative — copying CODECOV_TOKEN into the Dependabot secret store — was rejected:
      # it widens where that token is readable to buy a coverage report for a diff with no code
      # in it.
      CODECOV_ELIGIBLE: >-
        ${{ github.actor != 'dependabot[bot]'
            && (github.event_name != 'pull_request'
                || github.event.pull_request.head.repo.fork != true) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Codecov resolves the base commit of a pull request from history; a shallow clone
          # leaves it guessing.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # Keep dependency and wrapper caching, but do not restore Gradle's local
          # build cache: cached JaCoCo reports contain old session timestamps and
          # Codecov rejects reports older than 12 hours as REPORT_EXPIRED.
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # qualityCheckCi covers `build` (compile + tests, including push2u-core's fipsTest suite) and
      # adds Spotless verification, Checkstyle, PMD, SpotBugs, Error Prone/NullAway and the
      # aggregated coverage threshold. Everything the local `./gradlew qualityCheck` runs, minus the
      # auto-formatting.
      #
      # --no-build-cache: Gradle would otherwise be free to replay test results cached from an
      # environment without Docker, which turns the Testcontainers-backed Vault test into a silent
      # "skipped". Docker availability is not part of the cache key, so a stale hit hides failures.
      - name: Quality check
        run: ./gradlew qualityCheckCi --no-daemon --no-build-cache --stacktrace

      # The one rule in this build that `qualityCheckCi` cannot reach, because proving it means
      # failing: -Ppush2u.springBoot substitutes the catalog key, and no publishing task may run
      # while it is set. That key is BOTH the version the starters compile against and the floor
      # they publish, so a substituted release is internally consistent — compiled against the
      # substituted version and declaring it — and wrong for the reason that consistency hides:
      # the number it declares is not the minimum this project supports, and nothing about the
      # artifacts says so.
      #
      # It lives in `quality` rather than in the informative matrix below, and that placement is
      # the point: `quality` blocks a merge, so deleting the guard turns this red instead of
      # leaving every required check green. The two invocations are the two ways the previous
      # implementation was measured to be bypassed — Gradle's own camelCase abbreviation, and the
      # Central bundle, which reaches every module's publication through a task whose name says
      # nothing about publishing.
      #
      # The substituted value is the catalog's own, read out of the catalog. Nothing here needs a
      # different Spring Boot, and using one would put a version literal in this file: what is
      # being tested is that the property's PRESENCE is refused.
      - name: A substituted build refuses to publish
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^springBoot = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          test -n "$floor"
          for task in pTML nmcpZipAggregation; do
            if output=$(./gradlew -Ppush2u.springBoot="$floor" "$task" --no-daemon 2>&1); then
              echo "::error::$task published while -Ppush2u.springBoot was set; the guard is gone."
              exit 1
            fi
            if ! grep -q "substitutes the Spring Boot version" <<<"$output"; then
              echo "::error::$task failed, but not on the substitution guard. Output follows."
              echo "$output"
              exit 1
            fi
            echo "$task refused, as it must be."
          done

      # Every module's JUnit XML (including fipsTest) under one directory — Codecov's test-results
      # upload takes a single path. Runs even when the build failed: a failed suite is exactly what
      # test analytics is for.
      - name: Collect test results
        if: ${{ !cancelled() }}
        run: ./gradlew aggregateTestResults --no-daemon

      # main supplies the baseline Codecov reports against; the pull request runs are what make the
      # patch threshold and the PR comment in codecov.yml work at all. The hashFiles guard skips the
      # step when a run failed before producing the report, instead of tripping fail_ci_if_error on
      # a missing file.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && env.CODECOV_ELIGIBLE == 'true' && hashFiles('build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: the13haven/push2u
          # The aggregated report merges every module; the per-module reports would double-count.
          files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && env.CODECOV_ELIGIBLE == 'true' && hashFiles('build/test-results-aggregated/**/*.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: the13haven/push2u
          report_type: test_results
          flags: tests
          directory: build/test-results-aggregated
          fail_ci_if_error: true

      - name: Upload quality reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            **/build/reports/
            build/test-results-aggregated/

  # Which Spring Boot versions above the declared floor are there to try?
  #
  # gradle/libs.versions.toml's `springBoot` is the MINIMUM Spring Boot the starters support, and by
  # the same number the version the default build — and therefore `quality` above — compiles
  # against (ADR-032). That is the run that decides whether a change merges. It is also, by
  # construction, blind to a newer Spring Boot: the starters cannot see an API the floor lacks. The
  # matrix below is how that half is looked at, and it decides nothing.
  #
  # The versions are computed rather than listed, because a list in this file would name versions
  # nowhere else in the tree does and would go stale the week Spring publishes. The rule is one run
  # per released minor line at or above the floor's own, each at its newest GA patch, minus the
  # floor itself — GA only, so a milestone never becomes something this repository reacts to.
  spring-boot-above-floor:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Pick the released lines above the floor
        id: pick
        run: |
          set -euo pipefail
          curl -fsS --retry 3 \
            https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-dependencies/maven-metadata.xml \
            -o /tmp/spring-boot-metadata.xml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys, xml.etree.ElementTree as ET

          floor = re.search(
              r'^springBoot = "([^"]+)"', open("gradle/libs.versions.toml").read(), re.M
          ).group(1)
          floor_line = tuple(int(part) for part in floor.split(".")[:2])

          newest = {}
          for element in ET.parse("/tmp/spring-boot-metadata.xml").iter("version"):
              version = (element.text or "").strip()
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  continue          # a milestone or release candidate is not something to react to
              major, minor, patch = (int(part) for part in version.split("."))
              if (major, minor) < floor_line:
                  continue
              newest[(major, minor)] = max(newest.get((major, minor), (-1, "")), (patch, version))

          versions = sorted(
              (version for _, version in newest.values() if version != floor),
              key=lambda v: [int(part) for part in v.split(".")],
          )
          print("floor " + floor + ", trying " + (", ".join(versions) or "nothing newer"),
                file=sys.stderr)
          print("versions=" + json.dumps(versions))
          PY

  # One build per line above the floor, and it is INFORMATIVE: not a required check, and nothing it
  # produces is published. A red run here says the next floor move may be due — a starter meeting a
  # removed API, a behaviour Spring changed under it — and is read, not obeyed. fail-fast is off so
  # one bad line does not hide the others.
  #
  # `build` rather than `qualityCheckCi`: what this run asks is whether the starters still compile
  # and their tests still pass on a newer Spring Boot. Formatting, the analysers and the coverage
  # threshold do not vary with the framework's version and are `quality`'s to answer, once.
  spring-boot-compatibility:
    needs: spring-boot-above-floor
    if: ${{ !cancelled() && needs.spring-boot-above-floor.outputs.versions != '' && needs.spring-boot-above-floor.outputs.versions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ${{ fromJSON(needs.spring-boot-above-floor.outputs.versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # Only the two starter modules: they are the whole of what Spring Boot's version reaches.
      # -Ppush2u.springBoot substitutes the catalog key for this invocation alone, and every
      # publishing task in the build refuses to execute while it is set — a check on the task type,
      # so no spelling of a task name gets past it — which is why a run here cannot leave an
      # artifact behind declaring a minimum this project does not support.
      - name: Build the starters against Spring Boot ${{ matrix.spring-boot }}
        run: |
          ./gradlew -Ppush2u.springBoot=${{ matrix.spring-boot }} \
            :push2u-spring-boot-starter:build \
            :push2u-signer-vault-spring-boot-starter:build \
            --no-daemon --no-build-cache --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: spring-boot-${{ matrix.spring-boot }}-test-results
          path: |
            push2u-spring-boot-starter/build/reports/tests/
            push2u-signer-vault-spring-boot-starter/build/reports/tests/
