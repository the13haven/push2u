name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Testcontainers' Ryuk container must mount the daemon socket path as seen
      # from inside the runner's Docker VM.
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: 26
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
