name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      # Testcontainers' Ryuk container must mount the daemon socket path as seen
      # from inside the runner's Docker VM.
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: 26
          cache: gradle

      # qualityCheckCi covers `build` (compile + tests, including the FIPS suite) and adds
      # Spotless verification, Checkstyle, PMD, SpotBugs, Error Prone/NullAway and the aggregated
      # coverage threshold.
      #
      # --no-build-cache: Gradle would otherwise be free to replay test results cached from an
      # environment without Docker, which turns the Testcontainers-backed Vault test into a silent
      # "skipped". Docker availability is not part of the cache key, so a stale hit hides failures.
      - name: Quality check
        run: ./gradlew qualityCheckCi --no-daemon --no-build-cache --stacktrace

      - name: Upload quality reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: '**/build/reports/'
