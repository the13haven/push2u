name: CI

on:
  workflow_dispatch:

  # main only. A merge is a push event and pull_request does not fire for it, so this is the run that
  # verifies main and uploads to Codecov. Listing every branch here instead would double-run each
  # commit pushed to a branch that already has a PR open, since pull_request covers those already.
  #
  # No paths-ignore here, deliberately — see the `changes` job.
  push:
    branches: [ main ]

  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read

# Supersede an in-flight run when new commits land on the same ref. main is exempt: its run is the
# only one that uploads to Codecov, so cancelling it on a quick second merge would leave the branch
# without a coverage report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the quality gate has anything to look at.
  #
  # This used to be a paths-ignore filter under `on:`, which was wrong in a way that only shows up
  # at merge time. `quality` is a required status check in the "Protected main" ruleset, and a
  # workflow that never starts leaves its check in Pending forever — a documentation-only pull
  # request could not be merged at all. GitHub offers no path-based exemption for required checks,
  # neither in branch protection nor in rulesets; a ruleset can only exclude refs.
  #
  # A job skipped by an `if` condition, on the other hand, reports Success and satisfies the check.
  # So the filter has to sit here rather than under `on:`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The comparison below needs both endpoints and their merge base.
          fetch-depth: 0

      # Anything that is not documentation counts as code. Fail open, always: a manual dispatch, a
      # force push, a first push of a branch (github.event.before is all zeroes) or any range git
      # cannot resolve answers "code changed" and runs the full gate. The failure mode to avoid is
      # a broken comparison quietly waving a real change through as if it were a typo fix.
      - name: Detect non-documentation changes
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            echo "Cannot resolve ${BASE}...${HEAD} — running the quality gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${BASE}...${HEAD}")
          echo "Changed files:"
          echo "${changed}"

          # Prose and the images prose embeds. The suffix list started as the two the `on:` filter
          # used to carry, which was written before the repository contained any images at all —
          # adding the README banner then spent three minutes of the quality gate on a PNG. Nothing
          # here reaches a compiler, a test or an analyser.
          #
          # Pattern matching rather than grep, so the answer does not depend on which grep dialect
          # the runner image ships.
          code=false
          while IFS= read -r file; do
            case "${file}" in
              '' | *.md | *.txt) ;;
              *.png | *.jpg | *.jpeg | *.gif | *.svg | *.webp) ;;
              *) code=true; break ;;
            esac
          done <<< "${changed}"

          if [ "${code}" = false ]; then
            echo "Documentation only — the quality gate will be skipped (and reported as passed)."
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Testcontainers' Ryuk container must mount the daemon socket path as seen
      # from inside the runner's Docker VM.
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      # Codecov uploads run for main and for pull requests raised from this repository. Two cases
      # cannot, both because secrets.CODECOV_TOKEN expands to an empty string and the upload then
      # fails on a missing token instead of adding anything:
      #
      #   * a pull request from a fork — secrets are not exposed to it at all;
      #   * anything Dependabot opened. Its runs read from a SEPARATE secret store (Settings →
      #     Secrets → Dependabot), so a repository Actions secret is not visible even though the
      #     branch lives in this repository and is therefore not a fork. Nothing is lost by
      #     skipping: a dependency bump changes no source lines, so Codecov's patch analysis has
      #     nothing to report on it.
      #
      # The alternative — copying CODECOV_TOKEN into the Dependabot secret store — was rejected:
      # it widens where that token is readable to buy a coverage report for a diff with no code
      # in it.
      CODECOV_ELIGIBLE: >-
        ${{ github.actor != 'dependabot[bot]'
            && (github.event_name != 'pull_request'
                || github.event.pull_request.head.repo.fork != true) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Codecov resolves the base commit of a pull request from history; a shallow clone
          # leaves it guessing.
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # Keep dependency and wrapper caching, but do not restore Gradle's local
          # build cache: cached JaCoCo reports contain old session timestamps and
          # Codecov rejects reports older than 12 hours as REPORT_EXPIRED.
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # qualityCheckCi covers `build` (compile + tests, including push2u-core's fipsTest suite) and
      # adds Spotless verification, Checkstyle, PMD, SpotBugs, Error Prone/NullAway and the
      # aggregated coverage threshold. Everything the local `./gradlew qualityCheck` runs, minus the
      # auto-formatting.
      #
      # --no-build-cache: Gradle would otherwise be free to replay test results cached from an
      # environment without Docker, which turns the Testcontainers-backed Vault test into a silent
      # "skipped". Docker availability is not part of the cache key, so a stale hit hides failures.
      - name: Quality check
        run: ./gradlew qualityCheckCi --no-daemon --no-build-cache --stacktrace

      # Every module's JUnit XML (including fipsTest) under one directory — Codecov's test-results
      # upload takes a single path. Runs even when the build failed: a failed suite is exactly what
      # test analytics is for.
      - name: Collect test results
        if: ${{ !cancelled() }}
        run: ./gradlew aggregateTestResults --no-daemon

      # main supplies the baseline Codecov reports against; the pull request runs are what make the
      # patch threshold and the PR comment in codecov.yml work at all. The hashFiles guard skips the
      # step when a run failed before producing the report, instead of tripping fail_ci_if_error on
      # a missing file.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && env.CODECOV_ELIGIBLE == 'true' && hashFiles('build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: the13haven/push2u
          # The aggregated report merges all four modules; the per-module reports would double-count.
          files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && env.CODECOV_ELIGIBLE == 'true' && hashFiles('build/test-results-aggregated/**/*.xml') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: the13haven/push2u
          report_type: test_results
          flags: tests
          directory: build/test-results-aggregated
          fail_ci_if_error: true

      - name: Upload quality reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            **/build/reports/
            build/test-results-aggregated/
