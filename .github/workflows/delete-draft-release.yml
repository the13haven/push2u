name: Delete Draft Release

# Abandons a release that was tagged but never made it to Maven Central — the case where the fix
# is not "finish this release" (that is the Publish Existing Tag workflow) but "this version is
# not happening". Deletes the draft GitHub Release and, optionally, the tag itself so the number
# can be reused.
#
# Two guards make this safe to expose as a button:
#   * it refuses to touch a release that is not a draft, so a published release cannot be removed
#     by picking the wrong tag from the dropdown;
#   * before deleting a tag it checks whether the version is already on Maven Central, where
#     nothing can ever be taken back — reusing such a number would mean two different trees
#     claiming one immutable version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose DRAFT release should be deleted (e.g. v0.1.0)'
        required: true
        type: string
      deleteTag:
        description: 'Also delete the git tag, freeing the version number for reuse'
        required: false
        default: false
        type: boolean

# Deleting a release and a tag both write to repository contents.
permissions:
  contents: write

# Same group as the other release-management workflows — this one mutates the tag state they read.
concurrency:
  group: push2u-release-management
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Same pattern as Publish Existing Tag: the `v` prefix plus the official SemVer 2.0.0
          # regex from semver.org in POSIX ERE form.
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$TAG" =~ $tag_pattern ]]; then
            echo "Expected a release tag such as v0.1.0, got '$TAG'." >&2
            exit 1
          fi

      # The load-bearing guard. `gh release view --json isDraft` is the authority on whether this
      # release was ever visible to anyone; anything already published is off limits here.
      - name: Verify the release is still a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No GitHub Release exists for $TAG; nothing to delete." >&2
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
            echo "Release $TAG is published, not a draft — refusing to delete it." >&2
            echo "A published release corresponds to artifacts already on Maven Central." >&2
            exit 1
          fi

      # Checked before the tag goes, not before the release: a stray draft is harmless, a reused
      # version number is not. repo1 can lag a few minutes behind a successful deployment, so a
      # 404 here is "probably not published" rather than proof — the Central Portal itself remains
      # the last line of defence, since it rejects a version it has already accepted.
      - name: Verify the version never reached Maven Central
        if: ${{ inputs.deleteTag }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          url="https://repo1.maven.org/maven2/com/the13haven/push2u-core/$version/"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          echo "$url -> HTTP $status"
          if [ "$status" = "200" ]; then
            echo "Version $version is already on Maven Central and cannot be reused." >&2
            echo "Release the next version instead; Maven Central is immutable." >&2
            exit 1
          fi

      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        # --cleanup-tag is deliberately not used: tag deletion is a separate, opt-in decision
        # gated on the Maven Central check above.
        run: gh release delete "$TAG" --yes

      # Through the API with GITHUB_TOKEN rather than over SSH with the deploy key: this workflow
      # never needs to write commits, so it does not need ACTIONS_WRITE_KEY at all.
      - name: Delete the tag
        if: ${{ inputs.deleteTag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG"
          echo "Tag $TAG deleted; the version number is free again."

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          DELETED_TAG: ${{ inputs.deleteTag }}
        run: |
          echo "Draft release $TAG deleted."
          if [ "$DELETED_TAG" = "true" ]; then
            echo "Tag $TAG deleted as well."
            echo "Note: the release commit produced by axion is still on main." >&2
          else
            echo "Tag $TAG kept. Run Publish Existing Tag to finish this release later."
          fi
