# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every third-party action is pinned to a full 40-character commit SHA, with a trailing
    # `# vX.Y.Z` comment naming the release it corresponds to. Three of these workflows hold the
    # GPG signing key and the Central Portal token, and publishing is AUTOMATIC — no human sits
    # between upload and general availability on Maven Central — so whoever controls a mutable tag
    # like @v6 controls code running next to those secrets (the tj-actions/changed-files pattern,
    # March 2025). Pinning is repo-wide, not release-only: even where secrets only reach a later
    # Gradle step, a compromised action earlier in the job can modify the workspace, the wrapper
    # or the build scripts that then receive them — and this file cannot express different
    # policies per workflow anyway, so one policy is simpler and more reliable than a documented
    # exception.
    #
    # This section used to ignore minor and patch updates, on the reasoning that a
    # @v6 -> @v6.2.0 PR would convert a moving ref into a fixed one — a policy change disguised
    # as a bump. That was sound for tags and is obsolete for SHAs: a pinned ref receives NO
    # updates unless Dependabot proposes one, so every update type must now flow. Dependabot
    # rewrites both the SHA and the version comment in its PRs.
    #
    # One PR per round instead of one per action: the review act is the same for all of them
    # (does the new SHA match the tag it claims?), so batching costs nothing and cuts the noise.
    groups:
      github-actions:
        patterns:
          - "*"