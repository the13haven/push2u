# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Covers the declared dependencies AND the Gradle wrapper itself: since the ecosystem gained
  # wrapper support it reads gradle/wrapper/gradle-wrapper.properties — in the ROOT directory
  # only, which is why `directory` has to stay "/" — and rewrites distributionUrl together with
  # distributionSha256Sum whenever the file already carries a sum. Ours does, deliberately: see
  # CONTRIBUTING.md, "Upgrading Gradle". Do not add a blanket `ignore` for patch updates here; that
  # is where both the security fixes and the wrapper bumps arrive. The one `ignore` below is the
  # opposite of blanket — it names Spring Boot alone, and the comment there says why that
  # dependency is not one this project keeps fresh.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Spring Boot is the one exception, and it is not a dependency this project keeps fresh: the
    # catalog's `springBoot` is the MINIMUM Spring Boot the two starters support and publish as a
    # floor (ADR-032). A newer Spring Boot merely existing is not a reason to raise it — raising it
    # narrows the set of deployments this library answers for, so it is a decision with a pull
    # request that says what it narrows and a docs/MIGRATION.md note, not a version bump.
    #
    # Turning version updates off does NOT turn off the case that must move the floor. GitHub
    # documents `update-types` as affecting version updates only: "Security updates will always be
    # created regardless of the `update-types` setting"
    # (https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated).
    # So a published vulnerability in a Spring Boot artifact this build declares still arrives as a
    # pull request, which is exactly the one reason the floor moves on its own.
    #
    # What this cannot deliver is a vulnerability in something Boot's BOM manages into the floor's
    # graph — spring-core, spring-expression — since this build declares none of those and there is
    # no manifest entry for Dependabot to rewrite. Those surface as repository alerts, from the
    # dependency graph the submission workflow uploads from main, and the floor is raised by hand.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every action here is referenced by its major tag (@v6, @v7). That is not a version range —
    # GitHub Actions resolves a plain git ref — but the maintainers repoint that tag at each
    # release within the major, so a minor or patch release already reaches the workflows without
    # a commit. A pull request proposing @v6 -> @v6.2.0 would not deliver an update; it would
    # convert a moving ref into a fixed one, which is a policy change disguised as a bump.
    #
    # Majors still come through: those genuinely require editing the ref, and a major is where the
    # breaking change lives.
    #
    # NOT applied to the gradle ecosystem above, where the same rule would be actively harmful —
    # there a patch release is typically the security fix (the commons-lang3 pin in the quality
    # convention plugin is one), and suppressing it defeats the point of running Dependabot at all.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"