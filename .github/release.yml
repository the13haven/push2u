# Configuration for the release notes that `gh release create --generate-notes` (the last step of
# .github/workflows/release.yml) builds from merged pull requests.
# Schema: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Categories are matched top to bottom and a pull request lands in the first one whose label it
# carries, so the order below is a priority order: a PR labeled both `breaking-change` and
# `enhancement` is a breaking change first.
changelog:
  exclude:
    labels:
      # An explicit opt-out for housekeeping PRs that would only add noise to the changelog.
      - ignore-for-release
  categories:
    # One label per category, deliberately. A second name for the same category (semver-major,
    # feature, bugfix) was listed here at first, but none of those labels exists in the repository,
    # nothing creates them — the labelling workflow emits only the names below, Dependabot only
    # `dependencies` — and a second name that produces an identical section turns labelling into a
    # coin flip whose outcome carries no information and whose inconsistency is permanent.
    - title: "Breaking Changes"
      labels:
        - breaking-change
    # Second, and each neighbour for its own reason. Above "Bug Fixes" and "New Features": a
    # security fix is `fix:` by Conventional Commit and a hardening one is `feat:`, so the
    # labelling workflow gives it `bug` or `enhancement` and a `security` label added beside that
    # would otherwise name it nowhere. Below "Breaking Changes": the security fact also reaches
    # consumers through the published advisory, its CVE and their scanners, while an incompatible
    # change is announced here and nowhere else.
    - title: "Security"
      labels:
        - security
    - title: "New Features"
      labels:
        - enhancement
    - title: "Bug Fixes"
      labels:
        - bug
    # Dependency bumps get their own section instead of being excluded outright: for a library the
    # dependency set is part of the public surface, so silently dropping dependabot's PRs from the
    # changelog would hide exactly the changes downstream users may need to know about. Dependabot
    # applies the `dependencies` label to its PRs by default, which routes them here.
    - title: "Dependencies"
      labels:
        - dependencies
    - title: "Documentation"
      labels:
        - documentation
    # Catch-all, required by the schema to be the label of the last category so that PRs without
    # any of the labels above still show up instead of vanishing from the notes.
    - title: "Other Changes"
      labels:
        - "*"
