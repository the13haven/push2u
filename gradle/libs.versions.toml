# push2u's own version catalog — this is a standalone composite build (see settings.gradle.kts).
# Zero runtime IMPLEMENTATION dependencies is a deliberate design constraint of the library core:
# apart from JSpecify (annotations only, no code), everything below is test- or build-scoped. Versions verified present on Maven Central.
[versions]
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
# Spring Boot — for the two starter modules only (the core stays Spring-free, with no runtime
# implementation dependencies). This key carries ONE number with two meanings that must not be
# split (ADR-032): the MINIMUM Spring Boot the starters support and publish as a floor, and — by
# the same number — the Spring Boot the default build compiles against, so that a starter cannot
# use an API newer than the floor it advertises. Two keys would make the floor a promise the
# compiler never checks.
#
# It moves for two reasons and no others: a starter needs an API the floor lacks (a line move,
# owed a record of its own), or a published vulnerability sits anywhere in the graph this floor
# resolves — Spring Boot's own artifacts or anything its BOM manages into it — and a patch of the
# same line fixes it (obligatory, since the floor is a version consumers may be raised TO). A
# newer Spring Boot merely existing is not a reason, which is why Dependabot's version updates are
# switched off for these coordinates while its security updates are not. Either move narrows what
# this project answers for and is noted in docs/MIGRATION.md.
#
# Two LIVING documents carry this number and only two. This one, and README.md — which states it
# under Requirements and in its Spring Boot section, and which docs/SPRING.md defers to rather
# than repeating, so one stale README falsifies both at once. CI reads the value from here by
# regex and follows on its own; README does not. Move the number in both, in the same change.
# docs/MIGRATION.md names it too and is not a third place to edit: a migration section describes
# what one release did and its numbers are frozen on purpose.
#
# To run a build against a NEWER Spring Boot — which is how the next floor move is found — pass
# -Ppush2u.springBoot=<version> (see settings.gradle.kts). Such a run publishes nothing.
#
# Java 17+ baseline in the 4.0 line, so the modules' --release 21 is fine.
springBoot = "4.0.8"

# BouncyCastle — the stock provider push2u-core's `test` source set declares for the raw r||s ES256
# path, and nothing else. It used to serve a second, unrelated purpose: build.gradle.kts read this
# line textually to pin four BC artefacts on the buildscript classpath. That pin is gone (JGit now
# manages them at a clean version itself), and with it the reason this key had to name a version
# that exists for all four — which is what broke the build when a provider-only patch release came
# through. No module-level constraint applies it either; a constraint on a published module travels
# into its metadata. Jackson is not pinned — Spring Boot's own BOM governs it on the starter
# classpaths, at whatever version the declared floor manages.
bouncycastle = "1.85.2"
# BC-FIPS — test-only provider for the ES256 provider matrix (registers only DER-format ECDSA,
# exercising the DER fallback). Isolated in push2u-core's fipsTest source set: bc-fips and stock
# bcprov ship incompatible org.bouncycastle.crypto classes and can never share a classpath.
# Version verified present on Maven Central.
bouncycastleFips = "2.1.3"

# JSpecify — the nullness annotations the public API is marked with (@NullMarked / @Nullable), and
# the contract NullAway verifies. An annotation-only artifact with no code of its own; exposed as
# `api` so consumers and their tools (NullAway, IntelliJ, the Kotlin compiler) read the same
# contract. See README "Requirements".
jspecify = "1.0.1"

# Quality tool engines — the analyser versions the Gradle plugins run (see build-logic's
# push2u-quality convention plugin). Build-time only: none of these ever reaches a consumer's
# classpath, so pinning them here does not dent the zero-runtime-dependency constraint.
checkstyle = "13.9.0"
pmd = "7.26.0"
spotbugs = "4.10.3"
errorprone = "2.50.0"
nullaway = "0.14.0"
jacoco = "0.8.15"
palantir = "2.96.0"

# Quality tool Gradle plugins — resolved by the build-logic included build, never by push2u
# modules themselves.
spotbugsPlugin = "6.5.11"
errorpronePlugin = "5.1.1"
spotlessPlugin = "8.10.0"

# Release & publishing plugins — build-time only, like the quality stack above: they run in the
# build's own classpath and never reach a consumer's, so the zero-runtime-dependency constraint of
# the library stays intact. axion derives the project version from git tags (the tag is the single
# source of truth — no version constant to bump and forget); nmcp uploads the aggregated artifacts
# to Maven Central through the Central Portal publisher API. Versions verified present.
axion = "1.21.3"
nmcp = "1.6.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# Vault (dev mode) container for the push2u-signer-vault integration test.
testcontainers-vault = { module = "org.testcontainers:testcontainers-vault", version.ref = "testcontainers" }

# Spring Boot — for the two starter modules. The BOM (spring-boot-dependencies) aligns this
# build's own compile, annotation-processing and test classpaths, and never leaves the project:
# it is not on any published configuration, so a consumer's Spring/Jackson/Micrometer versions
# stay theirs (ADR-032).
#
# spring-boot-autoconfigure is the one Spring Boot artifact the starters publish, so it carries a
# version of its own rather than taking one from the BOM: an ordinary `require`, which Gradle
# reads as a minimum another requirement may raise. Without it the published dependency would
# have no version at all. The rest below stay versionless — they are compileOnly, annotation
# processing or test-only, where the BOM is present and nothing is published.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health" }
# Actuator endpoint infrastructure — test-only, for the starter's proof that the health endpoint's
# liveness group never includes the push2u indicator (spring-boot-health's endpoint/groups classes
# reference actuator's endpoint types, which the library itself never needs at runtime).
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-actuator" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
# Jackson annotations — spring-boot-health's Health type carries @JsonInclude; having the annotation
# jar on the compile classpath keeps javac from warning about the (BOM-managed) enum constant.
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }


# The stock provider, test-only: push2u-core's `test` source set declares it for the raw r||s ES256
# path. Nothing else in the build uses it, and no constraint applies it anywhere — which is why
# bcprov is the only BouncyCastle artefact with an alias here. The other three reach the buildscript
# classpath as JGit's transitives, but nothing in this build ever declared them: only the buildscript
# pin named them, and that pin no longer exists.
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# BC-FIPS test provider (separate artifact line from bcprov, hence its own version).
bouncycastle-bcfips = { group = "org.bouncycastle", name = "bc-fips", version.ref = "bouncycastleFips" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Quality tool libraries. The Checkstyle/PMD/SpotBugs/JaCoCo/Palantir entries exist so the
# convention plugin can pin the analyser version through the catalog; Error Prone and NullAway are
# real dependencies of the `errorprone` compiler configuration.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
# Quality plugins — consumed by build-logic (see build-logic/build.gradle.kts), which turns each
# alias into its plugin-marker coordinates.
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }

# Release/publishing plugins. axion-release and nmcp-aggregation are applied at the root only —
# versioning and the Central upload are whole-build concerns (Central validates one bundle with
# every published module together, so publishing cannot end half-done). Plain nmcp is applied per
# module by the push2u-publish convention plugin (via build-logic), where it exposes that module's
# publication to the root's aggregation.
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion" }
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
